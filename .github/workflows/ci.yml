name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black sqlfluff

      - name: Check Python formatting with Black
        run: |
          black --check src/pyspark/

      - name: Lint Python with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/pyspark/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other errors as warnings (exit-zero)
          flake8 src/pyspark/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint SQL models with SQLFluff
        run: |
          # Lint the DBT models using the Snowflake dialect
          sqlfluff lint dbt/ocp_transport/models --dialect snowflake
