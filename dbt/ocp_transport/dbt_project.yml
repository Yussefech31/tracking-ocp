name: 'ocp_transport'
version: '1.0.0'
config-version: 2

profile: 'ocp_transport'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ocp_transport:
    staging:
      +schema: STAGING
      +materialized: view
    analytics:
      +schema: ANALYTICS
      +materialized: table