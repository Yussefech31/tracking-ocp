services:

  postgres:
    image: postgres:16
    container_name: ocp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ocp_transport
      POSTGRES_USER: ocp_admin
      POSTGRES_PASSWORD: ocp_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ocp-network

  minio:
    image: quay.io/minio/minio
    container_name: ocp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ocp-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ocp-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://ocp-minio:9000
    networks:
      - ocp-network

networks:
  ocp-network:

volumes:
  postgres_data:
  minio_data: