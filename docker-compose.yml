services:

  postgres:
    image: postgres:16
    container_name: ocp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ocp_transport
      POSTGRES_USER: ocp_admin
      POSTGRES_PASSWORD: ocp_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ocp-network

  minio:
    image: quay.io/minio/minio
    container_name: ocp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ocp-network
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ocp-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://ocp-minio:9000
    networks:
      - ocp-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ocp-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://ocp-kafka:9092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@ocp-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9094'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - ocp-network


  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: ocp-airflow-init
    depends_on:
      postgres:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ocp_admin:ocp_password@ocp-postgres:5432/ocp_transport
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      DBT_PROFILES_DIR: /opt/airflow/project/dbt
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ACCOUNT: FMSAMMD-XE70136
      SNOWFLAKE_USER: YUSSEF31
      SNOWFLAKE_DATABASE: OCP_TRANSPORTS
      SNOWFLAKE_WAREHOUSE: OCP_TRANSPORTS_WH
      POSTGRES_HOST: ocp-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ocp_transport
      POSTGRES_USER: ocp_admin
      POSTGRES_PASSWORD: ocp_password
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./:/opt/airflow/project
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Youssef
      --lastname Admin
      --role Admin
      --email youssef@example.com || true
      "
    networks:
      - ocp-network

  airflow-apiserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: ocp-airflow-apiserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ocp_admin:ocp_password@ocp-postgres:5432/ocp_transport
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      DBT_PROFILES_DIR: /opt/airflow/project/dbt
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ACCOUNT: FMSAMMD-XE70136
      SNOWFLAKE_USER: YUSSEF31
      SNOWFLAKE_DATABASE: OCP_TRANSPORTS
      SNOWFLAKE_WAREHOUSE: OCP_TRANSPORTS_WH
      POSTGRES_HOST: ocp-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ocp_transport
      POSTGRES_USER: ocp_admin
      POSTGRES_PASSWORD: ocp_password
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./:/opt/airflow/project
    ports:
      - "8083:8080"
    command: api-server
    networks:
      - ocp-network

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: ocp-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ocp_admin:ocp_password@ocp-postgres:5432/ocp_transport
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      DBT_PROFILES_DIR: /opt/airflow/project/dbt
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ACCOUNT: FMSAMMD-XE70136
      SNOWFLAKE_USER: YUSSEF31
      SNOWFLAKE_DATABASE: OCP_TRANSPORTS
      SNOWFLAKE_WAREHOUSE: OCP_TRANSPORTS_WH
      POSTGRES_HOST: ocp-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ocp_transport
      POSTGRES_USER: ocp_admin
      POSTGRES_PASSWORD: ocp_password
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./:/opt/airflow/project
    command: scheduler
    networks:
      - ocp-network

  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: ocp-airflow-dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ocp_admin:ocp_password@ocp-postgres:5432/ocp_transport
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      DBT_PROFILES_DIR: /opt/airflow/project/dbt
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ACCOUNT: FMSAMMD-XE70136
      SNOWFLAKE_USER: YUSSEF31
      SNOWFLAKE_DATABASE: OCP_TRANSPORTS
      SNOWFLAKE_WAREHOUSE: OCP_TRANSPORTS_WH
      POSTGRES_HOST: ocp-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ocp_transport
      POSTGRES_USER: ocp_admin
      POSTGRES_PASSWORD: ocp_password
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./:/opt/airflow/project
    command: dag-processor
    networks:
      - ocp-network

  airflow-triggerer:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: ocp-airflow-triggerer
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ocp_admin:ocp_password@ocp-postgres:5432/ocp_transport
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      DBT_PROFILES_DIR: /opt/airflow/project/dbt
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ACCOUNT: FMSAMMD-XE70136
      SNOWFLAKE_USER: YUSSEF31
      SNOWFLAKE_DATABASE: OCP_TRANSPORTS
      SNOWFLAKE_WAREHOUSE: OCP_TRANSPORTS_WH
      POSTGRES_HOST: ocp-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ocp_transport
      POSTGRES_USER: ocp_admin
      POSTGRES_PASSWORD: ocp_password
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./:/opt/airflow/project
    command: triggerer
    networks:
      - ocp-network

networks:
  ocp-network:

volumes:
  postgres_data:
  minio_data: